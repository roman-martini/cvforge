  - { state: screening, at: "2026-07-22T14:00:00Z", note: "Llamada de 30 min con la recruiter" }

# `null` explícito, no ausente: distingue "todavía no me rechazaron" de "no
# sabemos en qué etapa fue". El reporte del funnel necesita esa diferencia.
rejectedStage: null

