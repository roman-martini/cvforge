  location:
    city: "Buenos Aires"
    countryCode: "AR"
    # Enum en minúsculas: remote | hybrid | onsite. Ojo, NO es el mismo enum que
    # `remote` de job.yaml, que viene del job-schema oficial y usa Full|Hybrid|None.
    remote: hybrid
  positions:
    # Dos posiciones en la misma empresa: así se modela una promoción sin
    # duplicar el empleador ni inflar la antigüedad.
    - id: work.acme-2023.staff
      # Sin abreviaturas. "Ing. Sr. de SW" no matchea ninguna búsqueda booleana.
      title: "Ingeniera de Software Staff"
      startDate: "2025-03"
      # `current: true` en vez de `endDate:` vacío. En YAML una clave sin valor
      # produce `null`, y `endDate: null` falla la validación del schema oficial
      # de JSON Resume. Con current, el compilador OMITE la clave entera.
      current: true
      seniority: staff
    - id: work.acme-2023.senior
      title: "Ingeniera Backend Senior"
      startDate: "2023-02"
      endDate: "2025-02"
      seniority: senior
