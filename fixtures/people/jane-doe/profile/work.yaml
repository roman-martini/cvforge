# yaml-language-server: $schema=../../../../schemas/generated/work.schema.json

# El corazón del modelo. Esto NO es "el CV": es el pool de hechos del que cada
# variante selecciona. Por eso Acme tiene siete bullets aunque ningún CV muestre
# más de cinco por rol — el overlay elige cuáles entran y en qué orden.
#
# Anatomía de un bullet (fórmula XYZ, Google/Laszlo Bock):
#   outcome  → X, el resultado. Va primero porque el reclutador escanea en 6-7 s
#              y rara vez pasa del tercer bullet de cada rol.
#   metric   → Y, la medida. OPCIONAL a propósito: exigirla en todos empuja a
#              inventar números, que es exactamente lo que se cae en la entrevista.
#   method   → Z, el método.
# Objetivo de longitud: 15-30 palabras entre outcome y method (1-2 líneas).
#
# `tags` alimenta el matcher contra los requisitos de una vacante: son términos
# libres, no una taxonomía cerrada. `priority` (0-100) desempata cuando el
# presupuesto de páginas aprieta y hay que sacrificar algo.

- id: work.acme-2023
