# yaml-language-server: $schema=../../../../schemas/generated/skills.schema.json

# `canonical` es la forma que se imprime por defecto. `aliases` existe porque
# varios ATS no resuelven que "K8s" y "Kubernetes" son lo mismo: el matcher
# reconoce cualquiera de las formas y el renderer emite LA QUE USA LA VACANTE.
# Por eso conviene listar también la forma expandida y el acrónimo.
#
# `yearsOfExperience` se deriva de work/ cuando no se declara. Declararlo acá
# sirve para los casos en que la experiencia no sale de un empleo (proyectos,
# docencia) o en que el cálculo automático subestima.

