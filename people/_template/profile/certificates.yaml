# Sección opcional. Array vacío = no tenés, y está bien.
#
# `expiresAt` no es decorativo: alimenta las preguntas eliminatorias del
# formulario ("¿tenés la certificación vigente al momento de ingresar?"). Una
# certificación vencida declarada como vigente es una discrepancia que se detecta
# en screening, y las discrepancias detectadas cuestan la oferta.
#
# Si la certificación no vence, simplemente no pongas `expiresAt`. La ausencia de
# la clave es la forma de decirlo; no inventes un `expiresAt: never`.

