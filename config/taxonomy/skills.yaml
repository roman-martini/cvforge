# Taxonomía de habilidades: una capacidad, muchas formas de nombrarla.
#
# Existe por un motivo concreto: la mayoría de los ATS resuelve keywords por coincidencia
# léxica, no semántica. "PMP certified" no matchea "Project Management Professional",
# "K8s" no matchea "Kubernetes" y "CI/CD" no matchea "Continuous Integration". El matcher
# de este workspace normaliza por esta tabla antes de comparar, y el renderer emite la
# forma que usa la vacante — no la que prefiere el candidato.
#
# Convención de campos:
#   canonical → la forma que se imprime por defecto en el CV
#   expanded  → la forma larga, cuando el canónico es una sigla. Habilita emitir
#               "Continuous Integration / Continuous Delivery (CI/CD)" una vez en el
#               documento, que es lo que pide la regla de acrónimos del dossier §7.5
#   aliases   → toda otra forma con la que la vacante puede nombrar lo mismo
#   category  → agrupa la sección de habilidades del CV; no participa del matching
#
# Criterio para agregar una entrada: que exista una vacante real que la nombre distinto de
# como la nombra el candidato. Una tabla de sinónimos exhaustiva no sirve de nada y se
# vuelve imposible de mantener.

